databases:
  - name: dulce-delicia-db
    databaseName: dulce_delicia
    user: dulce_delicia
    plan: free

services:
  - type: web
    name: dulce-delicia
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 2 --threads 4 --timeout 60 app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dulce-delicia-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
